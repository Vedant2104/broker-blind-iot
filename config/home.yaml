# The home: fixed list of devices and their topics.
# The CLI and dashboard only accept names and topics from this file.

# Where every client connects: the hub's policy gateway (trusted, on the LAN).
# Behind it sits the evil-broker proxy, then Mosquitto.
broker:
  host: localhost
  port: 8883

# The evil-broker proxy itself (the untrusted broker operator). Normally reached
# only through the hub; exposed so attack 8 can try to bypass the hub.
evil_broker:
  host: localhost
  port: 8885

# The real, stock Mosquitto behind the proxy. `bbiot spy` connects here to
# show exactly what the broker stores and forwards.
mosquitto:
  host: localhost
  port: 8884

# Control API of the evil-broker proxy (arming attacks). Localhost only.
proxy_control:
  host: localhost
  port: 8090

# Key directory and transparency log (HTTPS with transport-CA server certs).
directory:
  host: localhost
  port: 8443
translog:
  host: localhost
  port: 8444

# Key Distribution Center control API (centralized group keys). Localhost only;
# devices talk to the KDC over MQTT, through the untrusted broker.
kdc:
  host: localhost
  port: 8095

# Admin console: the admins' signing station (offline admin + root keys, mounted
# read-only). Mutual TLS; only the dashboard and cli identities may call it.
# Stop its container and approvals from the dashboard stop too ("offline").
admin_console:
  host: localhost
  port: 8096

# Each device process exposes a small simulator control API on its port
# (state, events, "send"). Localhost only; it is demo harness, not protocol.
devices:
  front-door:
    kind: lock
    label: Front door lock
    log_name: door/front
    control_port: 8101
    topics: {cmd: home/door/front/cmd, state: home/door/front/state}
  back-door:
    kind: lock
    label: Back door lock
    log_name: door/back
    control_port: 8102
    topics: {cmd: home/door/back/cmd, state: home/door/back/state}
  thermostat:
    kind: thermostat
    label: Living room thermostat
    log_name: thermostat
    control_port: 8103
    topics: {cmd: home/thermostat/living/cmd, state: home/thermostat/living/state}
  smoke-kitchen:
    kind: smoke
    label: Kitchen smoke sensor
    log_name: smoke/kitchen
    control_port: 8104
    topics:
      cmd: home/smoke/kitchen/cmd
      alarm: home/smoke/kitchen
      state: home/smoke/kitchen/state
  phone:
    kind: app
    label: Phone app
    log_name: phone
    control_port: 8105
    topics: {}
  # The hub: policy gateway (MUD), liveness monitor, quarantine, MLS group admin.
  hub:
    kind: hub
    label: Home hub
    log_name: hub
    control_port: 8107
    topics: {}
  # Not commissioned at setup: used to demo live pairing (`bbiot pair`).
  garage-lock:
    kind: lock
    label: Garage door lock
    log_name: door/garage
    control_port: 8106
    commissioned: false
    topics: {cmd: home/door/garage/cmd, state: home/door/garage/state}

# Decentralized (MLS) mode: the one member allowed to commit adds/removes.
# Every member refuses commits from anyone else.
group_admin: hub

# Infrastructure identities that also get mTLS client certificates.
# 'counterfeit' gets a transport (TLS) identity only — no device certificate (attack 8).
services: [cli, dashboard, evil-proxy, kdc, counterfeit]
