# Broker-Blind IoT — phase 2.
# All host ports bind to 127.0.0.1 only.
#
#   devices ──mTLS──> hub gateway :8883 ──> evil-broker ──mTLS──> Mosquitto   host :8884
#                     (MUD policy, trusted)  host :8885 (bypass, attack 8)
#   devices ──HTTPS─> directory :8443 ──HTTPS──> translog :8444
#
# Secrets layout and who mounts what:
#   ./offline/                       root + admin keys: pki-init and commission (one-shot
#                                    "offline ceremony" containers) and admin-console (the
#                                    admins' signing station; read-only, mTLS, dashboard-only)
#   ./secrets/pki/public/            root cert, signed admin roster, log cert (read-only, everyone)
#   ./secrets/tls/identities/<name>/ each container gets only its own transport TLS identity
#   ./secrets/devices/<id>/          each device's own identity keys (only that device)
#   ./secrets/translog/              log signing key (only translog)
#   ./secrets/kdc/                   KDC signing key (only the KDC)

name: bbiot

x-env: &env
  BBIOT_BROKER_HOST: hub
  BBIOT_EVIL_HOST: evil-broker
  BBIOT_EVIL_PORT: "8883"
  BBIOT_MOSQUITTO_HOST: broker
  BBIOT_MOSQUITTO_PORT: "8883"
  BBIOT_PROXY_HOST: evil-broker
  BBIOT_DIRECTORY_HOST: directory
  BBIOT_TRANSLOG_HOST: translog
  BBIOT_KDC_HOST: kdc
  BBIOT_ADMIN_CONSOLE_HOST: admin-console
  BBIOT_BENCH_HOST: bench-broker
  BBIOT_BENCH_PLAIN_PORT: "1883"
  BBIOT_BENCH_TLS_PORT: "8883"
  BBIOT_DEVICE_HOST: service
  BBIOT_CONTROL_BIND: 0.0.0.0

x-device: &device
  image: bbiot:dev
  restart: unless-stopped
  environment: *env
  depends_on:
    hub: {condition: service_started}
    pki-init: {condition: service_completed_successfully}

services:
  # --- one-shot setup -------------------------------------------------------------------

  # Transport CA + per-identity TLS certs in ./secrets/tls (if missing).
  tls-init:
    build: .
    image: bbiot:dev
    command: ["tls", "init", "--if-missing"]
    environment:
      BBIOT_BROKER_KEY_UID: "1883"  # mosquitto user inside eclipse-mosquitto
    volumes:
      - ./secrets:/app/secrets
    restart: "no"

  # Offline ceremony: root, admins A/B/C, log key (if missing).
  pki-init:
    image: bbiot:dev
    command: ["pki", "init"]
    depends_on:
      tls-init: {condition: service_completed_successfully}
    environment:
      BBIOT_OFFLINE_DIR: /app/offline
    volumes:
      - ./offline:/app/offline
      - ./secrets:/app/secrets
    restart: "no"

  # Commissioning ceremony: pairs every `commissioned: true` device (admins A + B).
  # Idempotent; garage-lock is left for the live pairing demo.
  commission:
    image: bbiot:dev
    command: ["pki", "bootstrap"]
    environment:
      <<: *env
      BBIOT_OFFLINE_DIR: /app/offline
    depends_on:
      directory: {condition: service_started}
      front-door: {condition: service_started}
      back-door: {condition: service_started}
      thermostat: {condition: service_started}
      smoke-kitchen: {condition: service_started}
      phone: {condition: service_started}
      hub: {condition: service_started}
    volumes:
      - ./offline:/app/offline
      - ./secrets:/app/secrets
    restart: "no"

  # --- untrusted infrastructure -----------------------------------------------------------

  # Stock Mosquitto, unmodified and untrusted.
  broker:
    image: eclipse-mosquitto:2.0.20
    depends_on:
      tls-init: {condition: service_completed_successfully}
    ports: ["127.0.0.1:8884:8883"]
    command: ["mosquitto", "-c", "/etc/bbiot/mosquitto.conf"]
    # Mount folders, not single files: Docker would otherwise create empty
    # directories in place of certs that tls-init has not written yet.
    volumes:
      - ./broker:/etc/bbiot:ro
      - ./secrets/tls/identities/broker:/certs:ro
    healthcheck:
      # Fast checks while starting, then rarely (each check logs a harmless
      # "unexpected eof" line in the broker log because it opens a bare TCP socket).
      test: ["CMD-SHELL", "nc -z localhost 8883 || exit 1"]
      start_period: 30s
      start_interval: 1s
      interval: 60s
      timeout: 2s
      retries: 3

  # The malicious broker operator: MITM in front of Mosquitto. Pass-through
  # unless an attack is armed through its control API (:8090).
  evil-broker:
    image: bbiot:dev
    restart: unless-stopped
    command: ["proxy", "run"]
    depends_on:
      broker: {condition: service_healthy}
    environment:
      <<: *env
      BBIOT_PROXY_LISTEN: 0.0.0.0
    ports: ["127.0.0.1:8885:8883", "127.0.0.1:8090:8090"]
    volumes:
      - ./secrets/tls/identities/broker:/app/secrets/tls/identities/broker:ro
      - ./secrets/tls/identities/evil-proxy:/app/secrets/tls/identities/evil-proxy:ro

  translog:
    image: bbiot:dev
    restart: unless-stopped
    command: ["run", "translog"]
    depends_on:
      pki-init: {condition: service_completed_successfully}
    environment:
      BBIOT_LISTEN: 0.0.0.0
      BBIOT_DATA_DIR: /app/data
    ports: ["127.0.0.1:8444:8444"]
    volumes:
      - ./secrets/pki/public:/app/secrets/pki/public:ro
      - ./secrets/translog:/app/secrets/translog:ro
      - ./secrets/tls/identities/translog:/app/secrets/tls/identities/translog:ro
      - translog-data:/app/data

  directory:
    image: bbiot:dev
    restart: unless-stopped
    command: ["run", "directory"]
    depends_on:
      translog: {condition: service_started}
    environment:
      <<: *env
      BBIOT_LISTEN: 0.0.0.0
      BBIOT_DATA_DIR: /app/data
    ports: ["127.0.0.1:8443:8443"]
    volumes:
      - ./secrets/pki/public:/app/secrets/pki/public:ro
      - ./secrets/tls/identities/directory:/app/secrets/tls/identities/directory:ro
      - directory-data:/app/data

  # Key Distribution Center (centralized group keys). Talks to devices over MQTT
  # through the evil broker; knows every group key (the centralized trade-off).
  kdc:
    image: bbiot:dev
    restart: unless-stopped
    command: ["run", "kdc"]
    depends_on:
      evil-broker: {condition: service_started}
      directory: {condition: service_started}
    environment:
      <<: *env
      BBIOT_LISTEN: 0.0.0.0
      BBIOT_DATA_DIR: /app/data
    ports: ["127.0.0.1:8095:8095"]
    volumes:
      - ./secrets/pki/public:/app/secrets/pki/public:ro
      - ./secrets/kdc:/app/secrets/kdc:ro
      - ./secrets/tls/identities/kdc:/app/secrets/tls/identities/kdc:ro
      - kdc-data:/app/data

  # The hub: policy gateway in front of the broker (host :8883), liveness monitor,
  # quarantine, MLS group admin. A commissioned device itself.
  hub:
    image: bbiot:dev
    restart: unless-stopped
    command: ["device", "run", "--id", "hub"]
    depends_on:
      evil-broker: {condition: service_started}
      pki-init: {condition: service_completed_successfully}
    environment:
      <<: *env
      BBIOT_BROKER_HOST: localhost  # its own MQTT client goes through its own gateway
      BBIOT_UPSTREAM_HOST: evil-broker
      BBIOT_UPSTREAM_PORT: "8883"
      BBIOT_GATEWAY_LISTEN: 0.0.0.0
    ports: ["127.0.0.1:8883:8883", "127.0.0.1:8107:8107"]
    volumes:
      - ./secrets/pki/public:/app/secrets/pki/public:ro
      - ./secrets/tls/identities/hub:/app/secrets/tls/identities/hub:ro
      - ./secrets/devices/hub:/app/secrets/devices/hub

  # --- devices (each sees only its own keys) ----------------------------------------------------

  front-door:
    <<: *device
    command: ["device", "run", "--id", "front-door"]
    ports: ["127.0.0.1:8101:8101"]
    volumes:
      - ./secrets/pki/public:/app/secrets/pki/public:ro
      - ./secrets/tls/identities/front-door:/app/secrets/tls/identities/front-door:ro
      - ./secrets/devices/front-door:/app/secrets/devices/front-door

  back-door:
    <<: *device
    command: ["device", "run", "--id", "back-door"]
    ports: ["127.0.0.1:8102:8102"]
    volumes:
      - ./secrets/pki/public:/app/secrets/pki/public:ro
      - ./secrets/tls/identities/back-door:/app/secrets/tls/identities/back-door:ro
      - ./secrets/devices/back-door:/app/secrets/devices/back-door

  thermostat:
    <<: *device
    command: ["device", "run", "--id", "thermostat"]
    ports: ["127.0.0.1:8103:8103"]
    volumes:
      - ./secrets/pki/public:/app/secrets/pki/public:ro
      - ./secrets/tls/identities/thermostat:/app/secrets/tls/identities/thermostat:ro
      - ./secrets/devices/thermostat:/app/secrets/devices/thermostat

  smoke-kitchen:
    <<: *device
    command: ["device", "run", "--id", "smoke-kitchen"]
    ports: ["127.0.0.1:8104:8104"]
    volumes:
      - ./secrets/pki/public:/app/secrets/pki/public:ro
      - ./secrets/tls/identities/smoke-kitchen:/app/secrets/tls/identities/smoke-kitchen:ro
      - ./secrets/devices/smoke-kitchen:/app/secrets/devices/smoke-kitchen

  phone:
    <<: *device
    command: ["device", "run", "--id", "phone"]
    ports: ["127.0.0.1:8105:8105"]
    volumes:
      - ./secrets/pki/public:/app/secrets/pki/public:ro
      - ./secrets/tls/identities/phone:/app/secrets/tls/identities/phone:ro
      - ./secrets/devices/phone:/app/secrets/devices/phone

  garage-lock:
    <<: *device
    command: ["device", "run", "--id", "garage-lock"]
    ports: ["127.0.0.1:8106:8106"]
    volumes:
      - ./secrets/pki/public:/app/secrets/pki/public:ro
      - ./secrets/tls/identities/garage-lock:/app/secrets/tls/identities/garage-lock:ro
      - ./secrets/devices/garage-lock:/app/secrets/devices/garage-lock

  # Benchmark-only Mosquitto (bench/): a plain listener and an mTLS listener, both
  # limited to bench/ topics. No device connects to it.
  bench-broker:
    image: eclipse-mosquitto:2.0.20
    depends_on:
      tls-init: {condition: service_completed_successfully}
    ports: ["127.0.0.1:1885:1883", "127.0.0.1:8887:8883"]
    command: ["mosquitto", "-c", "/etc/bbiot/mosquitto.conf"]
    volumes:
      - ./broker/bench:/etc/bbiot:ro
      - ./secrets/tls/identities/bench-broker:/certs:ro

  # The admins' signing station behind the dashboard's Approve buttons. Holds the
  # offline keys (read-only); serves mutual TLS and answers only the dashboard and
  # cli identities. `docker compose stop admin-console` takes the keys offline again.
  admin-console:
    image: bbiot:dev
    restart: unless-stopped
    command: ["run", "admin-console"]
    depends_on:
      directory: {condition: service_started}
    environment:
      <<: *env
      BBIOT_LISTEN: 0.0.0.0
      BBIOT_OFFLINE_DIR: /app/offline
    ports: ["127.0.0.1:8096:8096"]
    volumes:
      - ./offline:/app/offline:ro
      - ./secrets/pki/public:/app/secrets/pki/public:ro
      - ./secrets/tls/identities/admin-console:/app/secrets/tls/identities/admin-console:ro

  # --- dashboard + tools ------------------------------------------------------------------------

  dashboard:
    image: bbiot:dev
    restart: unless-stopped
    command: ["dashboard", "run", "--host", "0.0.0.0", "--port", "8000"]
    environment: *env
    depends_on:
      evil-broker: {condition: service_started}
    ports: ["127.0.0.1:8000:8000"]
    volumes:
      - ./secrets/pki/public:/app/secrets/pki/public:ro
      - ./secrets/tls/identities/dashboard:/app/secrets/tls/identities/dashboard:ro
      # attack 8 demo: the counterfeit device's (transport-only) identity
      - ./secrets/tls/identities/counterfeit:/app/secrets/tls/identities/counterfeit:ro
      # benchmark results (Benchmarks page; "Run quick benchmark" writes quick/)
      - ./bench/results:/app/bench/results

  # The admin's machine: `docker compose run --rm cli <command>`.
  cli:
    image: bbiot:dev
    profiles: ["tools"]
    environment:
      <<: *env
      BBIOT_OFFLINE_DIR: /app/offline
    volumes:
      - ./secrets:/app/secrets
      - ./offline:/app/offline
      - ./bench/results:/app/bench/results

  # Plain mosquitto_pub / mosquitto_sub with a client cert, e.g.:
  #   docker compose run --rm mqtt-tools mosquitto_sub -h broker -p 8883 \
  #     --cafile /certs/cli/ca.crt --cert /certs/cli/cert.pem --key /certs/cli/key.pem -t 'home/#' -v
  mqtt-tools:
    image: eclipse-mosquitto:2.0.20
    profiles: ["tools"]
    entrypoint: []
    user: root
    depends_on:
      broker: {condition: service_healthy}
    volumes:
      - ./secrets/tls/identities:/certs:ro

volumes:
  translog-data:
  directory-data:
  kdc-data:
