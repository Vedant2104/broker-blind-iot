# Benchmark-only Mosquitto (bench/messages.py). Not part of the home: no device
# connects here. Two listeners so "plain MQTT vs TLS only vs ours" share one broker.
# Both may only use topics under bench/ (acl).

per_listener_settings true
persistence false
log_dest stdout
log_type error
log_type warning

# Plain MQTT, no TLS: the "plain" baseline. Anonymous, bench/# only.
listener 1883
protocol mqtt
allow_anonymous true
acl_file /etc/bbiot/acl

# mTLS, same settings as the home broker.
listener 8883
protocol mqtt
cafile /certs/ca.crt
certfile /certs/cert.pem
keyfile /certs/key.pem
tls_version tlsv1.2
require_certificate true
use_identity_as_username true
allow_anonymous false
acl_file /etc/bbiot/acl
