# Stock Mosquitto, mTLS only. The broker is UNTRUSTED: this config only
# provides transport security. End-to-end protection is done by securelib.

per_listener_settings false
persistence false

log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
connection_messages true
log_timestamp_format %H:%M:%S

# Only an mTLS listener. No plaintext port.
listener 8883
protocol mqtt
cafile /certs/ca.crt
certfile /certs/broker.crt
keyfile /certs/broker.key
tls_version tlsv1.2
require_certificate true
# The client certificate CN becomes the MQTT username.
use_identity_as_username true
allow_anonymous false
