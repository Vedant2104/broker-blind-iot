[project]
name = "broker-blind-iot"
version = "0.0.1"
description = "Smart-home MQTT where the broker and key directory are untrusted"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "cryptography>=42",
    "paho-mqtt>=2.1",
    "typer>=0.12",
    "pyyaml>=6",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
bbiot = "cli.main:app"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = [
    "securelib*", "cli*", "devices*", "hub*", "directory*",
    "translog*", "rootca*", "dashboard*", "bench*", "evilbroker*", "kdc*",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM"]
ignore = ["B008"]  # Typer uses function calls in defaults

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: needs the docker compose broker running (BBIOT_INTEGRATION=1)"]
